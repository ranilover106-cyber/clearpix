<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearPix 4K - AI Photo Enhancer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-bottom: 25px; margin-top: 10px; }
    header h1 { font-size: 26px; color: #38bdf8; }
    header p { color: #94a3b8; font-size: 14px; margin-top: 5px; }

    .card { background: #1e293b; width: 100%; max-width: 450px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    
    .upload-area { border: 2px dashed #38bdf8; border-radius: 12px; padding: 30px 15px; cursor: pointer; margin-bottom: 20px; background: #0f172a; }
    .upload-area p { color: #94a3b8; font-size: 14px; }
    input[type="file"] { display: none; }

    .preview-box { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; display: none; }
    .preview-box img { width: 100%; height: auto; display: block; border-radius: 8px; }

    .btn { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .btn-download { background: #10b981; display: none; margin-top: 10px; }

    .status-text { margin-top: 15px; font-size: 14px; color: #f59e0b; display: none; }
    
    .api-input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 12px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <header>
    <h1>✨ ClearPix 4K</h1>
    <p>Blur photo ko Ultra HD / 4K banayein bilkul free</p>
  </header>

  <div class="card">
    <input type="password" id="apiKey" class="api-input" placeholder="Enter Free fal.ai API Key">
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <p id="uploadText">📁 Tap to Select Photo from Gallery</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="preview-box" id="previewContainer">
      <img id="imagePreview" src="" alt="Preview">
    </div>

    <button id="enhanceBtn" class="btn" disabled>Enhance to 4K</button>
    <div id="statusText" class="status-text">AI is enhancing... Please wait ⏳</div>
    
    <a id="downloadLink" download="enhanced-4k.png">
      <button class="btn btn-download" id="downloadBtn">⬇️ Download 4K Photo</button>
    </a>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewContainer = document.getElementById('previewContainer');
    const enhanceBtn = document.getElementById('enhanceBtn');
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');
    const downloadLink = document.getElementById('downloadLink');
    const apiKeyInput = document.getElementById('apiKey');

    let base64Image = "";

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          base64Image = event.target.result;
          imagePreview.src = base64Image;
          previewContainer.style.display = 'block';
          enhanceBtn.disabled = false;
          downloadBtn.style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    });

    enhanceBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Pehle apni free fal.ai API key daalein!");
        return;
      }

      enhanceBtn.disabled = true;
      statusText.style.display = 'block';

      try {
        const response = await fetch("https://fal.run/fal-ai/esrgan", {
          method: "POST",
          headers: {
            "Authorization": `Key ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            image_url: base64Image,
            scale: 4
          })
        });

        const data = await response.json();
        if (data.image && data.image.url) {
          imagePreview.src = data.image.url;
          downloadLink.href = data.image.url;
          downloadBtn.style.display = 'block';
          statusText.style.display = 'none';
          alert("Photo Successfully Enhanced to 4K!");
        } else {
          throw new Error("Enhance fail ho gaya");
        }
      } catch (err) {
        alert("Error: " + err.message);
        statusText.style.display = 'none';
        enhanceBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
